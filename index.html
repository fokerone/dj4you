<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DJ4YOU</title>
    <meta name="description" content="A DJ desk in your browser: two decks, sync, EQ, FX, loops and recording." />
    <meta name="theme-color" content="#07080c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app has loaded -->
      <div style="position:fixed;inset:0;display:grid;place-items:center;background:#07080c;color:#f3f6fb;font:700 1.4rem system-ui,sans-serif;letter-spacing:.03em">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <div style="width:44px;height:44px;border-radius:50%;border:4px solid #1d2230;border-top-color:#22d3ee;border-right-color:#fb923c;animation:s .9s linear infinite"></div>
          <span>DJ<span style="color:#fb923c">4</span>YOU</span>
        </div>
      </div>
      <style>@keyframes s{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
